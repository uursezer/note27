<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#fbfbfa" />
  <meta name="description" content="Uğur Sezer'in düzenlenmiş Lightroom bilgi tabanı." />
  <title>US Lightroom Notları</title>
  <style>
    :root{color-scheme:light dark}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#fbfbfa;color:#37352f;font:15px/1.5 ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.loader{width:min(420px,calc(100vw - 40px));padding:28px;border:1px solid rgba(55,53,47,.12);border-radius:16px;background:#fff;box-shadow:0 18px 50px rgba(15,15,15,.08)}.brand{font-weight:700;font-size:18px}.bar{height:4px;margin-top:18px;overflow:hidden;border-radius:999px;background:#ececea}.bar::after{content:"";display:block;width:45%;height:100%;border-radius:inherit;background:#37352f;animation:load 1.1s ease-in-out infinite}.note{margin:12px 0 0;color:#787774;font-size:13px}@keyframes load{0%{transform:translateX(-110%)}100%{transform:translateX(260%)}}@media(prefers-color-scheme:dark){body{background:#191919;color:#ebebea}.loader{background:#202020;border-color:rgba(255,255,255,.09)}.bar{background:#303030}.bar::after{background:#ebebea}.note{color:#aaa9a5}}
  </style>
</head>
<body>
  <main class="loader" role="status" aria-live="polite">
    <div class="brand">US Lightroom Notları</div>
    <div class="bar" aria-hidden="true"></div>
    <p class="note">Bilgi tabanı hazırlanıyor…</p>
  </main>
  <script src="./payload/part-1.js"></script>
  <script src="./payload/part-2.js"></script>
  <script src="./payload/part-3.js"></script>
  <script src="./payload/part-4.js"></script>
  <script>
    (async function boot(){
      try {
        if (!('DecompressionStream' in window)) throw new Error('Bu tarayıcı gzip açmayı desteklemiyor.');
        const binary = atob(window.__US_PAYLOAD || '');
        const bytes = new Uint8Array(binary.length);
        for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
        const stream = new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));
        const html = await new Response(stream).text();
        window.__US_PAYLOAD = null;
        document.open();
        document.write(html);
        document.close();
      } catch (error) {
        document.querySelector('.note').textContent = 'Site yüklenemedi: ' + error.message;
        console.error(error);
      }
    })();
  </script>
</body>
</html>
