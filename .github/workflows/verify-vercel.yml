name: Verify Vercel public access

on:
  push:
    paths:
      - '.github/workflows/verify-vercel.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check public URL
        shell: bash
        run: |
          set +e
          URL='https://dv-k8ryhhaol-dv-os1.vercel.app/'
          STATUS=$(curl -sS -L --max-time 45 -o /tmp/vercel-body.html -w '%{http_code}' "$URL")
          CURL_EXIT=$?
          BYTES=$(wc -c < /tmp/vercel-body.html 2>/dev/null || echo 0)
          TITLE=$(grep -oim1 '<title>[^<]*' /tmp/vercel-body.html | sed 's/<title>//I' || true)
          {
            echo "url=$URL"
            echo "http_status=$STATUS"
            echo "curl_exit=$CURL_EXIT"
            echo "bytes=$BYTES"
            echo "title=$TITLE"
            echo "checked_at=$(date -u +%FT%TZ)"
            echo 'body_preview<<EOF'
            head -c 700 /tmp/vercel-body.html 2>/dev/null || true
            echo
            echo 'EOF'
          } > vercel-check.txt
      - name: Commit result
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add vercel-check.txt
          git commit -m 'Record Vercel public access check' || exit 0
          git push
