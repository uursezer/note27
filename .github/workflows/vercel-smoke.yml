name: Verify Vercel public access

on:
  push:
    paths:
      - .github/workflows/vercel-smoke.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Wait briefly for deployment
        run: sleep 20

      - name: Fetch Vercel site without authentication
        shell: bash
        run: |
          set -euo pipefail
          URL="https://us-lightroom-arkadas-dv-os1.vercel.app/"
          curl --fail --location --retry 5 --retry-delay 5 --max-time 60 \
            --dump-header headers.txt --output page.html "$URL"
          cat headers.txt
          head -c 500 page.html
          echo
          grep -q "US Lightroom Notları" page.html
