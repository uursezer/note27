name: Verify Vercel public access

on:
  push:
    paths:
      - .github/workflows/vercel-smoke.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Wait briefly for deployment
        run: sleep 10

      - name: Test anonymous access
        shell: bash
        run: |
          set +e
          URL="https://us-lightroom-open2-dv-os1.vercel.app/"
          HTTP_CODE=$(curl --silent --show-error --location --retry 4 --retry-delay 3 --max-time 60 \
            --output page.html --write-out "%{http_code}" "$URL")
          CURL_EXIT=$?
          if [ "$CURL_EXIT" -eq 0 ] && [ "$HTTP_CODE" = "200" ] && grep -q "US Lightroom Notları" page.html; then
            RESULT="PUBLIC_OK"
          else
            RESULT="FAILED"
          fi
          {
            echo "$RESULT"
            echo "url=$URL"
            echo "http_code=$HTTP_CODE"
            echo "curl_exit=$CURL_EXIT"
            echo "checked_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } > vercel-public-status.txt
          head -c 2500 page.html > vercel-page-head.txt
          cat vercel-public-status.txt

      - name: Publish verification result
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add vercel-public-status.txt vercel-page-head.txt
          git commit -m "Record Vercel protection test" || exit 0
          git push
